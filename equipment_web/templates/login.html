{% extends "base.html" %}
{% block title %}登入｜設備管理與維護系統{% endblock %}

{% block content %}
<div class="panel login-card">
    <div class="panel-header">
        <div class="page-title">設備管理與維護系統</div>
        <div class="page-subtitle mb-0">請輸入測試資料中的 user_id</div>
    </div>
    <div class="panel-body">
        <form method="post" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label for="user_id" class="form-label">user_id</label>
                <input type="text" class="form-control" id="user_id" name="user_id" placeholder="例如：U001" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary w-100">登入</button>
        </form>
        <div class="mt-3 text-muted-small">
            測試帳號：U001 系所管理員、U002 設備負責人、U003 全系師生
        </div>
    </div>
</div>
{% endblock %}
